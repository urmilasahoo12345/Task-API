version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:

      - DATABASE_URL=postgresql://user:password@db:5432/taskdb
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=taskdb
    ports:
      - "5432:5432"
    volumes:

      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: